name: Import reviewed weekly intelligence
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and import reviewed JSON
        run: python scripts/import_reviewed.py
      - name: Update offline website snapshot
        run: python scripts/embed_data.py
      - name: Commit reviewed edition
        run: |
          git config user.name "foil-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "editorial: publish human-reviewed weekly analysis"
            git push
          fi
