name: Weekly free RSS and preliminary Chinese translation
on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      no_translate:
        description: 'Skip offline machine translation (faster)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local translation tools
        if: ${{ !inputs.no_translate }}
        run: |
          pip install --disable-pip-version-check argostranslate opencc-python-reimplemented || echo 'Offline translator unavailable; RSS collection continues.'
      - name: Collect RSS candidates
        env:
          SKIP_TRANSLATE: ${{ inputs.no_translate }}
        run: |
          if [ "$SKIP_TRANSLATE" = "true" ]; then
            python scripts/update_weekly.py --no-translate
          else
            python scripts/update_weekly.py
          fi
      - name: Commit review queue only
        run: |
          git config user.name "foil-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pending_news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: collect free RSS news candidates"
            git push
          fi
