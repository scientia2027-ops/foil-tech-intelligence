name: Publish public foil intelligence site
on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'editor.html'
      - 'assets/**'
      - 'data/**'
      - 'reports/**'
      - '.github/workflows/deploy-site.yml'
  workflow_run:
    workflows:
      - Weekly free RSS and preliminary Chinese translation
      - Import reviewed weekly intelligence
      - Monthly technical decision deck
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the latest published content
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage website-only files
        run: |
          mkdir -p public
          cp index.html editor.html .nojekyll public/
          cp -R assets data reports public/
      - name: Upload website to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
