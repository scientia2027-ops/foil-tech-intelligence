<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1148 410" role="img" aria-labelledby="t d"><title id="t">數位上膠與金屬裝飾示意</title><desc id="d">以可變圖文形成局部接著圖案</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b80fa"/></marker></defs><rect width="1148" height="410" rx="24" fill="#ffffff"/><rect width="1148" height="13" rx="5" fill="#146eff"/><text x="34" y="64" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-weight="700" font-size="29" fill="#112b56">數位上膠與金屬裝飾示意</text><text x="34" y="98" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" fill="#6382aa">以可變圖文形成局部接著圖案</text><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><g><rect x="30" y="154" rx="20" width="248" height="154" fill="#f0f6ff" stroke="#aecdf4" stroke-width="2"/><circle cx="65" cy="190" r="17" fill="#1768e6"/><text x="65" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">1</text><text x="48" y="239" font-size="22" fill="#102956" font-weight="700">數位成像</text><text x="48" y="271" font-size="15" fill="#50688b">噴墨解析度、圖文</text></g><g><rect x="310" y="154" rx="20" width="248" height="154" fill="#e7f0ff" stroke="#aecdf4" stroke-width="2"/><circle cx="345" cy="190" r="17" fill="#1768e6"/><text x="345" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">2</text><text x="328" y="239" font-size="22" fill="#102956" font-weight="700">膠層成形</text><text x="328" y="271" font-size="15" fill="#50688b">厚度、流平、潤濕</text></g><g><rect x="590" y="154" rx="20" width="248" height="154" fill="#f0f6ff" stroke="#aecdf4" stroke-width="2"/><circle cx="625" cy="190" r="17" fill="#1768e6"/><text x="625" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">3</text><text x="608" y="239" font-size="22" fill="#102956" font-weight="700">固化／轉印</text><text x="608" y="271" font-size="15" fill="#50688b">設備配置、UV 能量</text></g><g><rect x="870" y="154" rx="20" width="248" height="154" fill="#e7f0ff" stroke="#aecdf4" stroke-width="2"/><circle cx="905" cy="190" r="17" fill="#1768e6"/><text x="905" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">4</text><text x="888" y="239" font-size="22" fill="#102956" font-weight="700">圖像與後加工</text><text x="888" y="271" font-size="15" fill="#50688b">邊緣、觸感、耐磨</text></g><path d="M282 230 L301 230" stroke="#2b80fa" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M562 230 L581 230" stroke="#2b80fa" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M842 230 L861 230" stroke="#2b80fa" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/></g><path d="M30 353 H1118" stroke="#d7e3f2"/><text x="34" y="381" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="15" fill="#687b99">各品牌數位轉印設備的上膠位置與轉印、固化順序不一定相同。</text></svg>