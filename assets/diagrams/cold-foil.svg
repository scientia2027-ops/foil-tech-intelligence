<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1148 410" role="img" aria-labelledby="t d"><title id="t">柔版冷燙轉印示意</title><desc id="d">塗膠 → 壓合 → UV 固化 → 載體剝離</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b80fa"/></marker></defs><rect width="1148" height="410" rx="24" fill="#ffffff"/><rect width="1148" height="13" rx="5" fill="#146eff"/><text x="34" y="64" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-weight="700" font-size="29" fill="#112b56">柔版冷燙轉印示意</text><text x="34" y="98" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="19" fill="#6382aa">塗膠 → 壓合 → UV 固化 → 載體剝離</text><g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif"><g><rect x="30" y="154" rx="20" width="248" height="154" fill="#f0f6ff" stroke="#aecdf4" stroke-width="2"/><circle cx="65" cy="190" r="17" fill="#1768e6"/><text x="65" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">1</text><text x="48" y="239" font-size="22" fill="#102956" font-weight="700">UV 膠圖文</text><text x="48" y="271" font-size="15" fill="#50688b">膠量、網紋輥、被印材</text></g><g><rect x="310" y="154" rx="20" width="248" height="154" fill="#e7f0ff" stroke="#aecdf4" stroke-width="2"/><circle cx="345" cy="190" r="17" fill="#1768e6"/><text x="345" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">2</text><text x="328" y="239" font-size="22" fill="#102956" font-weight="700">箔材壓合</text><text x="328" y="271" font-size="15" fill="#50688b">線壓、速度、張力</text></g><g><rect x="590" y="154" rx="20" width="248" height="154" fill="#f0f6ff" stroke="#aecdf4" stroke-width="2"/><circle cx="625" cy="190" r="17" fill="#1768e6"/><text x="625" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">3</text><text x="608" y="239" font-size="22" fill="#102956" font-weight="700">UV 固化</text><text x="608" y="271" font-size="15" fill="#50688b">實際劑量、反應速率</text></g><g><rect x="870" y="154" rx="20" width="248" height="154" fill="#e7f0ff" stroke="#aecdf4" stroke-width="2"/><circle cx="905" cy="190" r="17" fill="#1768e6"/><text x="905" y="197" font-size="19" text-anchor="middle" fill="white" font-weight="700">4</text><text x="888" y="239" font-size="22" fill="#102956" font-weight="700">載體剝離</text><text x="888" y="271" font-size="15" fill="#50688b">角度、離型、轉印率</text></g><path d="M282 230 L301 230" stroke="#2b80fa" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M562 230 L581 230" stroke="#2b80fa" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M842 230 L861 230" stroke="#2b80fa" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/></g><path d="M30 353 H1118" stroke="#d7e3f2"/><text x="34" y="381" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="15" fill="#687b99">本圖為常見穿箔 UV 固化教學示意；固化與剝離次序、光源配置依設備而異。</text></svg>